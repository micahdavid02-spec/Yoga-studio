<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riverbend Yoga Studio | Events</title>
</head>
<body>
    <header>
        <h1>Upcoming Events</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="events.html">Events</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Monthly Workshops</h2>

            <figure>
                images/yoga-workshop.jpg

                <figcaption>
                    Monthly Mindfulness Workshop focused on stress reduction
                    and healthy breathing techniques.
                </figcaption>
            </figure>

            <ul>
                <li>January: Introduction to Yoga</li>
                <li>February: Mindful Breathing Workshop</li>
                <li>March: Balance and Flexibility Training</li>
            </ul>
        </section>

        <section>
            <h2>Request a Spot</h2>

            #

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <label for="interest">Class or Event Interest:</label>
                <input type="text" id="interest" name="interest" required>

                <br><br>

                <fieldset>
                    <legend>Experience Level</legend>

                    <input type="radio" id="beginner"
                        name="experience" value="beginner" required>
                    <label for="beginner">Beginner</label>

                    <input type="radio" id="intermediate"
                        name="experience" value="intermediate">
                    <label for="intermediate">Intermediate</label>

                    <input type="radio" id="advanced"
                        name="experience" value="advanced">
                    <label for="advanced">Advanced</label>
                </fieldset>

                <br>

                <fieldset>
                    <legend>Preferred Contact Method</legend>

                    <input type="radio" id="email-contact"
                        name="contact" value="email" required>
                    <label for="email-contact">Email</label>

                    <input type="radio" id="phone-contact"
                        name="contact" value="phone">
                    <label for="phone-contact">Phone</label>
                </fieldset>

                <br>

                <label for="message">Message:</label><br>

                <textarea id="message"
                          name="message"
                          rows="5"
                          cols="40"></textarea>

                <br><br>

                <input type="submit" value="Request Information">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Riverbend Yoga Studio</p>
    </footer>
</body>
</html>
